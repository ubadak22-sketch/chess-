<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHESS</title><link rel="stylesheet" href="css/main.css"></head>
<body data-theme="neon"><main id="app">
<section id="menu" class="screen active"><h1>CHESS</h1><p class="tag">NEXT GENERATION</p>
<nav><button data-go="levels">♟ PLAY VS AI</button><button data-go="pvp">👥 LOCAL PVP</button><button data-go="puzzle">🎯 PUZZLE MODE</button><button data-go="stats">📊 STATISTICS</button><button data-go="settings">⚙ SETTINGS</button></nav></section>
<section id="levels" class="screen"><h2>Choose difficulty</h2><nav>
<button data-lv="easy">EASY</button><button data-lv="medium">MEDIUM</button><button data-lv="hard">HARD</button><button data-lv="expert">EXPERT</button>
<button class="ghost" data-go="menu">‹ BACK</button></nav></section>
<section id="puzzle" class="screen"><h2>Puzzle mode</h2><p>Puzzles are coming soon. Hook them up in <code>js/puzzles.js</code>.</p><nav><button class="ghost" data-go="menu">‹ BACK</button></nav></section>
<section id="stats" class="screen"><h2>Statistics</h2><div id="stats-body" class="grid"></div><nav><button class="ghost" data-go="menu">‹ BACK</button></nav></section>
<section id="settings" class="screen"><h2>Settings</h2><div id="set-body"></div><nav><button class="ghost" data-go="menu">‹ BACK</button></nav></section>
<section id="game" class="screen">
<header class="hud"><button id="g-menu" class="chip">☰ MENU</button><span class="logo">CHESS</span><span id="g-move"></span></header>
<div class="player"><b>BLACK</b><span id="cap-w" class="cap"></span><span id="clk-b" class="clock"></span></div>
<div id="board"></div>
<div class="player"><b>WHITE</b><span id="cap-b" class="cap"></span><span id="clk-w" class="clock"></span></div>
<p id="turn"></p>
<div class="ctrl"><button id="b-undo">UNDO</button><button id="b-draw">DRAW</button><button id="b-resign">RESIGN</button><button id="b-new">NEW</button></div>
<ol id="hist"></ol></section>
<div id="overlay" hidden><div id="card"></div></div>
</main><script type="module" src="js/app.js"></script></body></html>
